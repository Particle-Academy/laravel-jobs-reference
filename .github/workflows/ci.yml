name: CI

# Why this exists on day one rather than later.
#
# This repo is the reference consumer: it is read and copied more than it is run.
# It shipped without CI, and the omission was recorded in a workstation-wide note
# saying "give every repo the standard workflow on day one" -- which would have
# made the note an assertion sitting above a repo that contradicted it. That is
# precisely the failure this repo's own AGENTS.md warns about, so it is fixed
# rather than filed.
#
# The live-serve job is the load-bearing one. The PHP suite can pass while the
# published JobsClient talks to URLs the package does not serve, because nothing
# in PHP exercises the client. A wrong URL is a 404 in the live-serve suite and
# nowhere else.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP suite + live-serve route agreement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Third-party dependency allowlist, FIRST -- before anything installs or
      # compiles. It is the only step whose failure means "do not evaluate this at
      # all": everything after it answers "does it work", this one answers "are we
      # allowed to ship it".
      #
      # FETCHED, never vendored: one source of truth, no copy to drift.
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v7
        with:
          repository: Particle-Academy/.github
          ref: b3b5e499c78467bd1e98d80af23a6b4861489ac5
          path: .third-party-allowlist
          persist-credentials: false

      - name: Verify the pinned checkout
        # Generated by pin-github-checks.mjs -- edit the pin with that tool, not by
        # hand. The ref above is a commit SHA, and every file the fetched code reads
        # is hashed here, so a push to the source repo cannot change what runs in
        # this workflow until someone reviews it and re-pins. It runs from the
        # workspace with nothing preloaded, so neither the job's working-directory
        # nor a variable an earlier step left behind decides what it reads or runs.
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
          BASH_ENV: ''
          ENV: ''
          SHELLOPTS: ''
          BASHOPTS: ''
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
          LD_AUDIT: ''
          DYLD_INSERT_LIBRARIES: ''
          DYLD_LIBRARY_PATH: ''
          PIN_ROOT: .third-party-allowlist
          PIN_DIR: .third-party-allowlist/third-party
          PIN_SHA: b3b5e499c78467bd1e98d80af23a6b4861489ac5
          PIN_SHA256: |
            4b94acfac87136b0942123b9f227919d7e2e3d67863bcdceba32c9a73f765db0  check.mjs
            1547306d567749d7410040cae2bfb9a648902de95c3378f6c5af54245c896e11  gate-graph.mjs
            b9423fcbc59c06b38862841f7111817cf586a3f5e7bcaf34349f26f7515b782d  allowlist.json
        run: |
          node -e '
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const { execFileSync } = require("node:child_process");
          const env = process.env;
          const fail = [];
          const head = execFileSync("git", ["-C", env.PIN_ROOT, "rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (head !== env.PIN_SHA) fail.push("checkout is at " + head + ", pinned " + env.PIN_SHA);
          const want = env.PIN_SHA256.split(String.fromCharCode(10)).map((l) => l.trim()).filter(Boolean);
          if (!want.length) fail.push("no file hashes are pinned");
          for (const entry of want) {
            const [hash, ...rest] = entry.split(" ").filter(Boolean);
            const file = rest.join(" ");
            let got = "missing";
            try {
              const text = fs.readFileSync(env.PIN_DIR + "/" + file, "latin1");
              const lf = text.split(String.fromCharCode(13, 10)).join(String.fromCharCode(10));
              got = crypto.createHash("sha256").update(lf, "latin1").digest("hex");
            } catch {}
            if (got !== hash) fail.push(file + " sha256 is " + got + ", pinned " + hash);
          }
          for (const f of fail) console.log("::error::Pinned checkout mismatch: " + f);
          if (fail.length) {
            console.log("::error::Refusing to run fetched code that does not match its pin. Review the upstream change, then re-pin with pin-github-checks.mjs.");
            process.exit(1);
          }
          console.log("Pinned checkout verified: " + head + ", " + want.length + " files match.");
          '

      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          # Delete it. A fetched checkout left in the workspace is not inert --
          # vitest has globbed a checker's own tests out of one and failed a
          # package whose code was fine.
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: mbstring, sqlite3, pdo_sqlite
        env:
          update: true # latest patch, not the runner's preinstalled one
      - name: Floor PHP at the PHP2Shell-patched release (CVE-2026-109618/109619)
        run: php -r '$v=$argv[1]??PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION.".".PHP_RELEASE_VERSION; $f=["8.5"=>"8.5.12","8.4"=>"8.4.27","8.3"=>"8.3.36","8.2"=>"8.2.35"][implode(".",array_slice(explode(".",$v),0,2))]??(version_compare($v,"8.6",">=")?"8.6":"8.2.35"); if(version_compare($v,$f,"<")){echo "::error::PHP $v is below the PHP2Shell floor $f".PHP_EOL;exit(1);} echo "PHP $v >= PHP2Shell floor $f".PHP_EOL;'

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # `npm ci`, because this repo DOES track package-lock.json. That matters:
      # where a repo tracks no lockfile, CI resolves the tree from scratch and a
      # local `npm test` is not running what CI runs -- which let a sibling package
      # ship three releases over a red build.
      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # 27 tests. The gate column, the resume authorization, the identity-spoof
      # suite, and the event wiring.
      - name: PHP suite
        run: php artisan test

      # 21 tests. Boots the app on a real port against a throwaway SQLite file and
      # drives the PUBLISHED @particle-academy/job-board client at it.
      #
      # It carries its own environment in `.env.liveserve` rather than in exported
      # variables, and the reason is a trap worth knowing: `php artisan serve` does
      # NOT hand its environment to the server process. It forwards
      # ServeCommand::$passthroughVariables -- APP_ENV, PATH, a few Herd/Xdebug
      # ones -- and DB_* is not on the list. Pass DB_DATABASE and the server reads
      # .env instead, answers 200 from an empty database, and the suite fails with
      # "the board does not list the posting", which reads exactly like a bug in
      # the package's visibility scope.
      #
      # The harness asserts the fixture is visible over HTTP before handing control
      # to the tests, so a harness fault cannot masquerade as a product fault.
      - name: Live-serve route agreement
        run: npm run test:live
